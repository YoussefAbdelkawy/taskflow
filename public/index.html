<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard – TaskFlow</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <script src="vendor/basecoat.min.js" defer></script>
  </head>
  <body>
    <header id="app-header"></header>
    <!-- US7-3: my dashboard, filled from GET /api/dashboard by the app script below -->
    <main class="mx-auto max-w-6xl px-4 py-8 md:px-6" data-breadcrumb="Dashboard">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="eyebrow" id="today"></p>
          <h1 class="mt-1 text-2xl font-semibold" id="welcome">Welcome</h1>
        </div>
        <a class="btn" data-size="sm" href="projects.html" id="go-projects">
          <svg class="lucide" aria-hidden="true">
            <use href="vendor/lucide.svg#folder-kanban" />
          </svg>
          Open projects
        </a>
      </div>

      <div
        id="stats"
        class="mt-6 grid grid-cols-2 gap-px overflow-hidden rounded-lg border bg-border lg:grid-cols-4"
        aria-live="polite"
      >
        <div class="bg-card p-4">
          <p class="text-muted-foreground">Open tasks</p>
          <p class="stat-value mt-1" data-stat="open">–</p>
          <p class="mt-1 text-xs text-muted-foreground">assigned to you</p>
        </div>
        <div class="bg-card p-4">
          <p class="text-muted-foreground">Due this week</p>
          <p class="stat-value mt-1" data-stat="dueThisWeek">–</p>
          <p class="mt-1 text-xs text-muted-foreground">today and the next 6 days</p>
        </div>
        <div class="bg-card p-4">
          <p class="text-muted-foreground">Overdue</p>
          <p class="stat-value mt-1" data-stat="overdue">–</p>
          <p class="mt-1 text-xs text-muted-foreground">past the due date, not done</p>
        </div>
        <div class="bg-card p-4">
          <p class="text-muted-foreground">Done</p>
          <p class="stat-value mt-1" data-stat="done">–</p>
          <p class="mt-1 text-xs text-muted-foreground">tasks you completed</p>
        </div>
      </div>

      <div class="mt-8 grid gap-6 lg:grid-cols-3">
        <section class="min-w-0 lg:col-span-2" aria-labelledby="due-soon-title">
          <div class="flex items-center justify-between">
            <h2 class="font-medium" id="due-soon-title">Due soon</h2>
            <a class="text-sm text-muted-foreground hover:text-foreground" href="my-tasks.html"
              >View all</a
            >
          </div>
          <div id="due-soon" class="mt-3 divide-y rounded-lg border bg-card"></div>
        </section>
        <section class="min-w-0" aria-labelledby="progress-title">
          <div class="flex items-center justify-between">
            <h2 class="font-medium" id="progress-title">Project progress</h2>
            <a class="text-sm text-muted-foreground hover:text-foreground" href="projects.html"
              >All projects</a
            >
          </div>
          <div id="project-progress" class="mt-3 rounded-lg border bg-card"></div>
        </section>
      </div>

      <p class="mt-10 flex items-center gap-2 text-xs text-muted-foreground">
        <span class="status-dot bg-status-todo" id="status-dot"></span>
        Server: <span id="status">checking…</span>
      </p>
    </main>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
