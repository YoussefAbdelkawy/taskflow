<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in – TaskFlow</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="grid min-h-screen lg:grid-cols-2">
      <section class="flex flex-col justify-center bg-card px-6 py-12 sm:px-12">
        <div class="mx-auto w-full max-w-sm">
          <div class="flex items-center gap-2">
            <span
              class="grid size-8 place-items-center rounded-md bg-foreground text-sm font-bold text-background"
              >TF</span
            >
            <span class="font-semibold tracking-tight">TaskFlow</span>
          </div>
          <h1 class="mt-8 text-3xl font-semibold">Sign in to TaskFlow</h1>
          <p class="mt-2 text-muted-foreground">Projects, tasks and reports for your team.</p>

          <form id="login-form" class="form mt-8 grid gap-4" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                class="input"
                autocomplete="username"
                aria-describedby="email-error"
                required
              />
              <p id="email-error" class="text-xs text-destructive" role="alert"></p>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                class="input"
                autocomplete="current-password"
                aria-describedby="password-error"
                required
              />
              <p id="password-error" class="text-xs text-destructive" role="alert"></p>
            </div>
            <p id="login-error" class="text-sm text-destructive" role="alert"></p>
            <button type="submit" class="btn w-full">Sign in</button>
          </form>

          <p class="mt-6 text-xs text-muted-foreground">
            Demo accounts: <span class="font-mono">mona@taskflow.test</span> (manager) or
            <span class="font-mono">karim@taskflow.test</span> (member), password
            <span class="font-mono">Password123!</span>
          </p>
        </div>
      </section>
      <section class="hidden items-center justify-center overflow-hidden bg-sidebar p-12 lg:flex">
        <img
          src="img/dashboard-preview.png"
          alt="The TaskFlow dashboard with open tasks, due dates and project progress"
          class="w-full max-w-2xl rounded-lg border"
        />
      </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
